<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 480" role="img"
     aria-label="OmniRemote SCAN screen mockup">
  <rect width="270" height="480" fill="#0a0a0a" rx="14"/>
  <text x="135" y="78"  text-anchor="middle" fill="#facc15"
        font-family="ui-monospace, Menlo, monospace" font-weight="800" font-size="64">SCAN</text>
  <text x="135" y="148" text-anchor="middle" fill="#cbd5e1"
        font-family="ui-monospace, Menlo, monospace" font-size="32">12 / 83</text>
  <text x="135" y="220" text-anchor="middle" fill="#22d3ee"
        font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="36">Hitachi</text>
  <line x1="22" y1="270" x2="248" y2="270" stroke="#374151" stroke-width="2"/>
  <text x="135" y="320" text-anchor="middle" fill="#f5f6f8"
        font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="34">release</text>
  <text x="135" y="362" text-anchor="middle" fill="#f5f6f8"
        font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="34">to lock</text>
  <text x="135" y="424" text-anchor="middle" fill="#facc15"
        font-family="ui-monospace, Menlo, monospace" font-size="20">B = manual lock</text>
  <text x="135" y="450" text-anchor="middle" fill="#6b7280"
        font-family="ui-monospace, Menlo, monospace" font-size="16">(if no beep)</text>
</svg>
