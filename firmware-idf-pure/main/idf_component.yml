## OmniRemote main component — declared dependencies pulled by ESP-IDF
## Component Manager.

dependencies:
  idf:
    version: ">=5.0"
  ## M5Stack's Unified library is IDF-native (ships idf_component.yml in
  ## the upstream repo). Brings M5GFX (display) + button + power + IMU.
  m5stack/M5Unified:
    version: "^0.2.0"
  ## TinyUSB wrapper from Espressif — drives composite CDC + MSC over
  ## the M5StickS3's USB-C port. CDC carries the IDF console (ESP_LOGI etc),
  ## MSC exposes a read-only OmniRemote drive with README/install link.
  espressif/esp_tinyusb:
    version: "^1.4.0"
