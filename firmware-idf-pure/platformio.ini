; OmniRemote firmware — pure ESP-IDF.
;
; Why pure IDF (and not Arduino, not arduino+espidf hybrid):
;   - The Arduino + ESP-IDF hybrid pulls in esp_rainmaker / esp_insights
;     etc transitively; PIO can't build their target_add_binary_data steps
;     correctly. Dead end (see firmware-idf/ for the failed attempt).
;   - Pure Arduino can't do composite CDC + MSC on M5Unified because
;     ARDUINO_USB_MODE=0 blackscreens. Dead end (see firmware/ commit log).
;   - Pure IDF lets us drive TinyUSB directly (composite CDC + MSC is
;     well-supported), pick exactly which IDF components ship, and bring
;     in only the libraries we want.
;
; Strategy:
;   - Start with a Hello-World skeleton (this file) to validate the toolchain.
;   - Add LovyanGFX as IDF component (replaces M5Unified for display).
;   - Add IRremoteESP8266 vendored as IDF component with minimal Arduino.h
;     shim.
;   - Add native I2S + ES8311 driver for mic, GPIO + debouncer for buttons,
;     NVS for profiles.
;   - Wire TinyUSB composite (CDC + MSC) at the end.
;
; Build & flash:
;   pio run -e m5sticks3 -t upload
;   pio device monitor -e m5sticks3

[platformio]
default_envs = m5sticks3
; ESP-IDF expects sources under main/, not src/.
src_dir = main

[env:m5sticks3]
platform                = espressif32
board                   = esp32-s3-devkitc-1
framework               = espidf
upload_speed            = 921600
monitor_speed           = 115200
monitor_filters         = esp32_exception_decoder, time
board_upload.flash_size = 8MB
board_build.f_flash     = 80000000L
board_build.flash_mode  = qio
board_build.partitions  = partitions.csv
