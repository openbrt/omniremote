; M5StickS3 universal AC remote.
;
; UX: on first boot (or after factory reset), the device enters SEARCH mode and
; cycles through ~20 AC protocols, sending "Power ON, Cool, 26 C, Fan Auto"
; every ~2 s. User watches their AC; when it responds (beep/airflow), they
; press BtnB to lock the current protocol into NVS. Subsequent boots enter
; READY mode directly. Hold both buttons ~3 s to re-enter SEARCH.
;
; Build & flash:
;   pio run -e m5sticks3-ac -t upload
;   pio device monitor -e m5sticks3-ac
;
; Restore CueKit firmware:
;   esptool --port /dev/cu.usbmodem212101 write_flash 0x0 \
;     ../backup_20260505_184432.bin

[platformio]
default_envs = m5sticks3-ac

[env:m5sticks3-ac]
platform                        = espressif32
board                           = esp32-s3-devkitc-1
framework                       = arduino
monitor_speed                   = 115200
upload_speed                    = 921600
board_upload.flash_size         = 8MB
board_build.arduino.memory_type = qio_opi
board_build.f_cpu               = 240000000L
board_build.f_flash             = 80000000L
board_build.flash_mode          = qio
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_M5STACK_STICKS3
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
